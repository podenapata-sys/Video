<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>clip3_orbit</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a140f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1a140f; }
      #backdrop { position: absolute; inset: -80px; }
      #backdrop img { width: 100%; height: 100%; object-fit: cover; filter: blur(40px) brightness(0.62) saturate(1.1); display: block; }
      #hero { position: absolute; left: 0; top: 593px; width: 1080px; height: 733px;
        transform-origin: 596.1px 397.4px; }
      #hero img, #hero2 img { width: 100%; height: 100%; display: block;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 9%, #000 91%, transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 9%, #000 91%, transparent 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(20,12,4,0.55) 100%); }
      #sweep { position: absolute; inset: 0; clip-path: polygon(15.1% 34.4%, 84.1% 33.4%, 84.3% 69.2%, 15.2% 77.4%); overflow: hidden; pointer-events: none; }
      #band { position: absolute; top: -20%; left: 0; width: 22%; height: 140%;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.32) 50%, rgba(255,255,255,0) 100%); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
      <div id="backdrop"><img src="assets/clock-bg.png" alt="" /></div>
      <div id="hero"><img src="assets/clock.png" alt="LED digital desk clock" /><div id="sweep"><div id="band"></div></div></div>
      <div id="vignette"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hero", { scale: 1.5, x: -86.1, y: -30.9, rotationY: -7, transformPerspective: 1800 },
        { scale: 1.55, x: -26.1, y: -30.9, rotationY: 7, transformPerspective: 1800, duration: 5, ease: "sine.inOut" }, 0);
      tl.fromTo("#backdrop", { x: 40 }, { x: -40, duration: 5, ease: "sine.inOut" }, 0);
      tl.fromTo("#band", { x: -300 }, { x: 1250, duration: 2.6, ease: "power1.inOut" }, 1.1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
